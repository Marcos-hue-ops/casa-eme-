# Publica o site pronto na branch `hostinger`, para a Hostinger puxar.
#
# A hospedagem de sites da Hostinger não roda `npm run build`: ela só copia
# arquivos. Por isso esta automação gera o site (a pasta dist/, com o
# .htaccess) a cada atualização da branch do site e grava o resultado,
# sozinho, na branch `hostinger`. No hPanel, em Avançado → Git, aponte para
# essa branch (README → "Publicar na Hostinger").
#
# Domínio e indexação: por padrão, https://casaememoema.com.br, aberto ao
# Google. Para mudar sem editar este arquivo, crie em GitHub → Settings →
# Secrets and variables → Actions → Variables: SITE_URL e SITE_PUBLICAVEL
# ("false" tira o site do Google).
#
# Google Analytics 4: o ID de métricas da Casa EME vai abaixo, em
# GA_MEASUREMENT_ID. Só o site da Hostinger (o do domínio) mede; as prévias
# e o build local saem sem Analytics e sem aviso de cookies. Uma variável
# GA_MEASUREMENT_ID criada no mesmo lugar das outras tem prioridade sobre o
# ID daqui (README → "Analytics").
name: Site para a Hostinger

on:
  push:
    branches: [claude/brave-faraday-alroh1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://casaememoema.com.br' }}
      SITE_PUBLICAVEL: ${{ vars.SITE_PUBLICAVEL || 'true' }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-X15KSL351K' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Cada publicação vira um commit novo em cima do anterior (sem apagar o
      # histórico): o "git pull" da Hostinger sempre consegue avançar, e dá
      # para voltar a uma versão antiga se for preciso.
      - name: Grava o site pronto na branch hostinger
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTO" hostinger > /dev/null; then
            git clone -q --depth 1 --branch hostinger "$REMOTO" publicar
          else
            git init -q -b hostinger publicar
          fi
          find publicar -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. publicar/
          cd publicar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "O site pronto não mudou: nada a publicar."
            exit 0
          fi
          git commit -q -m "Site pronto para a Hostinger (${GITHUB_SHA::7})"
          git push -q "$REMOTO" HEAD:hostinger
