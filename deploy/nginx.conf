# Exemplo de configuração — Nginx.
#
# A Content-Security-Policy não está escrita aqui de propósito: ela contém os
# hashes dos scripts inline, que mudam a cada build. Copie a linha pronta de
# dist/csp.gerada.txt para o add_header abaixo, ou deixe a política valer apenas
# pela meta tag que já sai em cada página (o que se perde nesse caso é o
# frame-ancestors, coberto pelo X-Frame-Options logo abaixo).

server {
  listen 443 ssl http2;
  server_name casaememoema.com.br;

  root /var/www/casa-eme/dist;
  index index.html;

  charset utf-8;
  # Não anuncie a versão do servidor.
  server_tokens off;

  # add_header Content-Security-Policy "<cole de dist/csp.gerada.txt>" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

  # CSS e JS levam o hash do conteúdo no nome (tools/postbuild.js); fontes não mudam.
  location ~ ^/assets/(css|js|fonts)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Fotos mantêm o nome quando trocadas por versão melhor: um mês de cache.
  location /assets/img/ {
    add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
    try_files $uri =404;
  }

  # Os arquivos que rastreadores leem antes de tudo: cache curto com
  # revalidação, para que um robots.txt velho não continue barrando o site.
  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;
}

# Todo o tráfego em texto claro vai para HTTPS.
server {
  listen 80;
  server_name www.casaememoema.com.br casaememoema.com.br;
  return 301 https://casaememoema.com.br$request_uri;
}
