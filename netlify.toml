# Netlify / Cloudflare Pages (alternativa à Vercel).
#
# Os cabeçalhos de segurança não moram aqui: o build gera dist/_headers com a
# Content-Security-Policy já resolvida (os hashes dos scripts inline mudam a
# cada alteração no HTML), e a Netlify lê esse arquivo da pasta publicada.
# Ver tools/postbuild.js.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
